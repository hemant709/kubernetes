apiVersion: apps/v1
kind: Deployment
metadata:
  name: hemant-deployment
  namespace: auto-deploy
  labels:
    app: myapp
    component: deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80