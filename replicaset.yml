apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: hemant-replicaset
  namespace: hemant-ns
  labels:
    app: myapp
    component: replicaset
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      component: rs-pod
  template:
    metadata:
      labels:
        app: myapp
        component: rs-pod
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80